# D54 confirmatory round, tuning step (2026-10-04). Tuning instances ONLY (A-n44-k6, A-n69-k9; §11.1, D35).
# 10 s, 5 seeds, 3 configurations per algorithm (equal tuning budget). The A-n63 alpha sweep is NOT used.
# Selection rule (fixed before the run): per algorithm, the configuration with the lowest mean gap averaged over
# the two instances (each instance's mean over its 5 runs, then the plain average); ties -> the current default.
# The choice is written to configs/experiments/d54_choice.yaml and committed BEFORE the confirmation run.
name: tune_d54
description: "D54 tuning (tuning instances only): QPSO-noQUBO alpha {fixed 0.3, fixed 0.5, adaptive}; PSO+LS (w, c1, c2) {current, (0.6,1.7,1.7), (0.8,1.3,1.3)}; 10 s, 5 seeds"
instances: [A-n44-k6, A-n69-k9]
runs: 5
weights: [0.0, 1.0, 0.0, 0.0]
reference: qn_adaptive
variants:
  qn_fixed_0.3: {algo: qpso, params: {qubo_slot: {enabled: false}, alpha_mode: fixed, alpha_fixed: 0.3}}
  qn_fixed_0.5: {algo: qpso, params: {qubo_slot: {enabled: false}, alpha_mode: fixed, alpha_fixed: 0.5}}
  qn_adaptive:  {algo: qpso, params: {qubo_slot: {enabled: false}}}
  pso_current:  {algo: pso_ls, params: {}}
  pso_0.6_1.7:  {algo: pso_ls, params: {w: 0.6, c1: 1.7, c2: 1.7}}
  pso_0.8_1.3:  {algo: pso_ls, params: {w: 0.8, c1: 1.3, c2: 1.3}}
budgets:
  - {type: time, value: 10, algorithms: [qn_fixed_0.3, qn_fixed_0.5, qn_adaptive, pso_current, pso_0.6_1.7, pso_0.8_1.3]}
