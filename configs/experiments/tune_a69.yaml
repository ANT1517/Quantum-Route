# Second tuning-only instance (D35): behaviour at larger n without looking at test instances.
# Final configurations only (no configuration changes after this run). NOT a benchmark: never quote.
name: tune_a69
description: "A-n69-k9 tuning-only check of the final configs: QPSO-full (D33), RR+LS, PSO+LS, GA+LS, SA. Not a benchmark"
instances: [A-n69-k9]
runs: 5
weights: [0.0, 1.0, 0.0, 0.0]
reference: qpso_full
variants:
  qpso_full: {algo: qpso, params: {}}
budgets:
  - {type: evals, value: 12000, algorithms: [qpso_full, rr_ls, pso_ls, ga_ls, sa]}
  - {type: time, value: 10, algorithms: [qpso_full, rr_ls, pso_ls, ga_ls, sa]}
